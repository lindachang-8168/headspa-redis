services:

  mysql:
    image: mysql:8.4
    container_name: headspa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: headspa
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-13307}:3306"   # 避開預設 3306，以及 Windows（Hyper-V）常保留的 3307 附近
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: headspa-redis-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: headspa-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 前後端已合併：前端 HTML 由 Spring Boot（src/main/resources/static）直接提供
      # 網頁和 API 共用同一個 port（預設 8090，可在 .env 用 APP_PORT 覆蓋）
      - "${APP_PORT:-8090}:8080"
    environment:
      # 覆蓋 application.yaml 裡的連線設定，改指向同一個 docker network 裡的服務名稱
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/headspa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

volumes:
  mysql-data:
