name: Deploy HeadSPA Booking to AWS

# AWS 主機目前已停用，改為「手動觸發」：到 GitHub → Actions → 選這個 workflow → Run workflow
# 需要重新啟用自動部署時，把下面改回：
#   on:
#     push:
#       branches:
#         - master
# 並在 repo Settings → Secrets 設好 AWS_HOST / AWS_USER / AWS_SSH_KEY。
#
# 前後端已合併成同一個 repo：前端 HTML 放在 src/main/resources/static，
# 由 Spring Boot 直接提供，所以只需要 pull 這一個 repo、重建 app 即可。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 進 AWS 主機並重新部署
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd ~

            if [ ! -d headspa-redis ]; then
              git clone https://github.com/lindachang-8168/headspa-redis.git headspa-redis
            fi
            cd headspa-redis
            git pull origin master

            # .env（含 MYSQL_PASSWORD）平時就留在主機上，不會進 Git

            # 舊版的獨立前端容器（Nginx）佔用 80 port，先停掉移除
            docker rm -f headspa-frontend 2>/dev/null || true

            # 重建並啟動 mysql / redis / app（app 內含前端頁面）
            docker compose up -d --build --remove-orphans

            # 清掉沒用到的舊 image，避免主機空間被塞滿
            docker image prune -f
